[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robodoctor-prismwam-runtime"
version = "0.1.0"
description = "Vendored PrismWAM inference dependencies for RoboDoctor"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy", "Pillow", "imageio", "imageio-ffmpeg",
  "torch>=2.7,<2.11", "torchvision>=0.22,<0.26", "einops==0.8.1",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "safetensors>=0.4",
  "transformers>=4.51,<6", "huggingface-hub>=0.34,<2",
  "sentencepiece", "ftfy", "regex", "tqdm", "h5py", "rich",
  "GitPython", "av", "opencv-python-headless<4.12",
]

[tool.setuptools]
license-files = ["OFFICIAL_LICENSE", "UPSTREAM_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prismwam*"]
